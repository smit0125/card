<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Visiting Card — Tap to Connect</title>
  <meta name="theme-color" content="#0A0A0A" />

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            obsidian: '#0A0A0A',
            surface: '#141414',
            gold: {
              DEFAULT: '#D4AF37',
              light: '#F3D97E',
              dark: '#A68623',
            },
            whatsapp: '#25D366',
          },
          keyframes: {
            fadeUp: {
              '0%': { opacity: '0', transform: 'translateY(16px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            ambientFloat: {
              '0%, 100%': { transform: 'translate(0, 0) scale(1)', opacity: '0.65' },
              '50%': { transform: 'translate(-12px, 16px) scale(1.08)', opacity: '0.95' },
            },
            ambientFloatAlt: {
              '0%, 100%': { transform: 'translate(0, 0) scale(1)', opacity: '0.5' },
              '50%': { transform: 'translate(14px, -14px) scale(1.1)', opacity: '0.8' },
            },
            shimmerSweep: {
              '0%': { transform: 'translateX(-120%) skewX(-18deg)' },
              '100%': { transform: 'translateX(220%) skewX(-18deg)' },
            },
            pulseRing: {
              '0%': { transform: 'scale(0.92)', opacity: '0.7' },
              '70%': { transform: 'scale(1.22)', opacity: '0' },
              '100%': { transform: 'scale(1.22)', opacity: '0' },
            },
          },
          animation: {
            'fade-up': 'fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both',
            'ambient-gold': 'ambientFloat 11s ease-in-out infinite',
            'ambient-emerald': 'ambientFloatAlt 14s ease-in-out infinite',
            'shimmer': 'shimmerSweep 3.2s ease-in-out infinite',
            'pulse-ring': 'pulseRing 2.2s cubic-bezier(0.24, 0, 0.38, 1) infinite',
          },
        },
      },
    };
  </script>
</head>
<body class="bg-obsidian text-neutral-100 font-sans antialiased selection:bg-gold/30 selection:text-gold-light min-h-screen overflow-x-hidden relative">

  <!-- Ambient Background Radial Glows -->
  <div aria-hidden="true" class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div class="absolute -top-28 -right-24 w-80 h-80 rounded-full bg-gold/[0.11] blur-[100px] animate-ambient-gold"></div>
    <div class="absolute top-1/2 -left-28 w-72 h-72 rounded-full bg-whatsapp/[0.07] blur-[110px] animate-ambient-emerald"></div>
    <div class="absolute -bottom-24 right-4 w-72 h-72 rounded-full bg-gold/[0.08] blur-[100px] animate-ambient-gold"></div>
  </div>

  <!-- Main Mobile-First Container (Centered Card Hub) -->
  <main class="relative z-10 w-full max-w-[440px] mx-auto px-4 pt-7 pb-28">

    <!-- 1. Brand / Profile Header (Rendered Dynamically) -->
    <header id="brand-header" class="text-center mb-7 animate-fade-up" style="animation-delay: 40ms;"></header>

    <!-- 2. Direct Contacts Section (2 Full Contact Cards) -->
    <section aria-labelledby="contacts-heading" class="mb-7">
      <div class="flex items-center justify-between px-1 mb-3 animate-fade-up" style="animation-delay: 120ms;">
        <h2 id="contacts-heading" class="text-[11px] font-semibold uppercase tracking-[0.18em] text-gold/90 flex items-center gap-2">
          <span class="w-4 h-[1px] bg-gold/60 inline-block"></span>
          Direct Contacts
        </h2>
        <span class="text-[11px] text-neutral-500">Tap to call or save</span>
      </div>
      <div id="contacts-container" class="space-y-3.5"></div>
    </section>

    <!-- 3. WhatsApp Direct Options Section -->
    <section aria-labelledby="whatsapp-heading" class="mb-7">
      <div class="flex items-center justify-between px-1 mb-3 animate-fade-up" style="animation-delay: 260ms;">
        <h2 id="whatsapp-heading" class="text-[11px] font-semibold uppercase tracking-[0.18em] text-whatsapp/90 flex items-center gap-2">
          <span class="w-4 h-[1px] bg-whatsapp/60 inline-block"></span>
          WhatsApp Direct
        </h2>
        <span class="text-[11px] text-neutral-500">Instant chat</span>
      </div>
      <div id="whatsapp-container" class="space-y-2.5"></div>
    </section>

    <!-- 4. Instagram Options Section -->
    <section aria-labelledby="instagram-heading" class="mb-7">
      <div class="flex items-center justify-between px-1 mb-3 animate-fade-up" style="animation-delay: 340ms;">
        <h2 id="instagram-heading" class="text-[11px] font-semibold uppercase tracking-[0.18em] text-pink-400/90 flex items-center gap-2">
          <span class="w-4 h-[1px] bg-gradient-to-r from-[#f09433] via-[#dc2743] to-[#bc1888] inline-block"></span>
          Instagram
        </h2>
        <span class="text-[11px] text-neutral-500">Follow our updates</span>
      </div>
      <div id="instagram-container" class="space-y-2.5"></div>
    </section>

    <!-- 5. Additional Details & Share Section -->
    <section aria-labelledby="more-heading" class="mb-8">
      <div class="flex items-center justify-between px-1 mb-3 animate-fade-up" style="animation-delay: 420ms;">
        <h2 id="more-heading" class="text-[11px] font-semibold uppercase tracking-[0.18em] text-neutral-400 flex items-center gap-2">
          <span class="w-4 h-[1px] bg-neutral-600 inline-block"></span>
          More Ways to Connect
        </h2>
      </div>
      <div id="additional-container" class="space-y-2.5"></div>
    </section>

    <!-- Subtle Footer -->
    <footer id="card-footer" class="text-center pt-2 pb-4 animate-fade-up" style="animation-delay: 500ms;"></footer>
  </main>

  <!-- Floating Bottom Action Dock (Share + Backup QR Code) -->
  <div class="fixed bottom-4 left-0 right-0 z-30 flex justify-center px-4 pointer-events-none">
    <div class="pointer-events-auto flex items-center gap-2 p-1.5 rounded-full bg-surface/90 backdrop-blur-xl border border-white/[0.1] shadow-[0_12px_40px_rgba(0,0,0,0.75)]">
      <button
        id="dock-share-btn"
        type="button"
        class="flex items-center gap-2 px-4 py-2.5 rounded-full text-xs font-semibold text-neutral-200 hover:text-white hover:bg-white/[0.07] active:scale-95 transition-all"
      >
        <svg class="w-4 h-4 text-gold" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
        </svg>
        Share Card
      </button>
      <span class="w-[1px] h-5 bg-white/10"></span>
      <button
        id="dock-qr-btn"
        type="button"
        class="flex items-center gap-2 px-4 py-2.5 rounded-full text-xs font-semibold bg-gradient-to-r from-gold via-gold-light to-gold text-obsidian shadow-[0_0_20px_rgba(212,175,55,0.28)] hover:brightness-110 active:scale-95 transition-all"
      >
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h6v6H3V3zm12 0h6v6h-6V3zM3 15h6v6H3v-6zm13 0h2v2h-2v-2zm3 0h2v2h-2v-2zm-3 3h2v3h-2v-3zm3 2h2v1h-2v-1zm-6-5h2v2h-2v-2zm0 4h2v2h-2v-2z" />
        </svg>
        Show QR Code
      </button>
    </div>
  </div>

  <!-- Backup QR Code Modal -->
  <div
    id="qr-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="qr-modal-title"
    class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/80 backdrop-blur-md transition-opacity duration-200 opacity-0"
  >
    <div id="qr-modal-card" class="relative w-full max-w-[360px] rounded-3xl bg-surface border border-gold/25 p-6 shadow-[0_24px_80px_rgba(0,0,0,0.85)] transform scale-95 transition-transform duration-200">
      <!-- Close Button -->
      <button
        id="qr-close-btn"
        type="button"
        aria-label="Close QR Modal"
        class="absolute top-4 right-4 w-9 h-9 rounded-full bg-white/[0.06] hover:bg-white/[0.12] border border-white/10 flex items-center justify-center text-neutral-300 active:scale-90 transition-all"
      >
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <!-- Modal Header -->
      <div class="text-center mb-5">
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-gold/10 border border-gold/25 text-gold-light text-[10px] font-semibold uppercase tracking-widest mb-2.5">
          Backup Scan
        </div>
        <h3 id="qr-modal-title" class="text-lg font-bold text-white tracking-tight">Scan to Open Card</h3>
        <p class="text-xs text-neutral-400 mt-1">No NFC on their phone? Let them scan this QR code.</p>
      </div>

      <!-- QR Code Canvas Container -->
      <div class="bg-white rounded-2xl p-4 mx-auto w-fit shadow-[0_0_35px_rgba(212,175,55,0.18)] border-2 border-gold/40">
        <canvas id="qr-canvas" class="block rounded-lg"></canvas>
      </div>

      <!-- Encoded URL Preview -->
      <div class="mt-4 px-3 py-2 rounded-xl bg-black/50 border border-white/[0.07] text-center">
        <p id="qr-url-display" class="text-[11px] text-neutral-400 font-mono truncate"></p>
      </div>

      <!-- Modal Actions -->
      <div class="grid grid-cols-2 gap-2.5 mt-4">
        <button
          id="qr-copy-btn"
          type="button"
          class="flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-xl bg-white/[0.07] hover:bg-white/[0.12] border border-white/10 text-xs font-semibold text-white active:scale-95 transition-all"
        >
          <svg class="w-4 h-4 text-gold" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
          Copy Link
        </button>
        <button
          id="qr-download-btn"
          type="button"
          class="flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-xl bg-gold/20 hover:bg-gold/30 border border-gold/35 text-xs font-semibold text-gold-light active:scale-95 transition-all"
        >
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
          Save QR PNG
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification (Never uses alert()) -->
  <div
    id="toast"
    role="status"
    aria-live="polite"
    class="fixed top-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 -translate-y-3 transition-all duration-300"
  >
    <div class="flex items-center gap-2 px-4 py-2.5 rounded-full bg-surface/95 backdrop-blur-xl border border-gold/35 shadow-[0_10px_30px_rgba(0,0,0,0.75)] text-xs font-medium text-white whitespace-nowrap">
      <span class="w-2 h-2 rounded-full bg-gold"></span>
      <span id="toast-message">Copied!</span>
    </div>
  </div>

  <script>

        <path d="M12.031 2C6.502 2 2 6.502 2 12.031c0 1.766.461 3.49 1.337 5.012L2 22l5.095-1.336a9.99 9.99 0 004.936 1.298h.004c5.529 0 10.031-4.502 10.031-10.031S17.56 2 12.031 2zm5.847 14.242c-.246.693-1.434 1.326-1.99 1.409-.513.076-1.164.108-1.882-.12-.436-.139-.997-.324-1.718-.635-3.025-1.307-5-4.365-5.151-4.566-.15-.201-1.229-1.636-1.229-3.12 0-1.484.777-2.214 1.053-2.516.276-.301.602-.377.803-.377.2 0 .401.002.577.011.185.009.433-.07.677.517.251.603.854 2.087.929 2.238.075.151.125.327.025.528-.1.201-.151.327-.301.503-.151.176-.317.393-.452.528-.151.15-.308.314-.132.616.176.301.782 1.29 1.679 2.089 1.154 1.029 2.126 1.348 2.427 1.499.301.151.477.126.652-.075.176-.201.753-.879.954-1.18.201-.301.401-.251.677-.151.276.101 1.756.828 2.057.979.301.151.502.226.577.352.075.125.075.728-.171 1.421z"/>

    /* =========================================================================
       UTILITY FUNCTIONS: Toast, Clipboard, vCard (.vcf), Share, URL Helper
    ========================================================================= */
    let toastTimer = null;

    function showToast(message) {
      const toast = document.getElementById('toast');
      const msgEl = document.getElementById('toast-message');
      if (!toast || !msgEl) return;

      msgEl.textContent = message;
      toast.classList.remove('opacity-0', '-translate-y-3');
      toast.classList.add('opacity-100', 'translate-y-0');

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-3');
      }, 2400);
    }

    /**
     * Safe HTML escaping to prevent markup glitches when editing CARD_CONFIG.
     */
    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /**
     * Extract clean initials (up to 2 letters) from a full name.
     */
    function getInitials(name) {
      const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
      if (parts.length === 0) return 'ID';
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    /**
     * Reliable clipboard copy using document.execCommand('copy') for iframe safety.
     */
    function copyTextToClipboard(text) {
      try {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.top = '-9999px';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        textarea.setSelectionRange(0, textarea.value.length);
        const copied = document.execCommand('copy');
        document.body.removeChild(textarea);
        return copied;
      } catch (err) {
        return false;
      }
    }

    /**
     * Build a WhatsApp deep link with an optional pre-filled greeting message.
     */
    function buildWhatsAppUrl(number, message) {
      const cleanNum = String(number || '').replace(/[^\d]/g, '');
      const textParam = message ? `?text=${encodeURIComponent(message)}` : '';
      return `https://wa.me/${cleanNum}${textParam}`;
    }

    /**
     * Determine the active public URL for sharing and QR code generation.
     */
    function getShareableUrl() {
      if (CARD_CONFIG.brand.publicCardUrl && CARD_CONFIG.brand.publicCardUrl.trim()) {
        return CARD_CONFIG.brand.publicCardUrl.trim();
      }
      const href = window.location.href;
      if (href && /^https?:\/\//i.test(href)) {
        return href;
      }
      return 'https://yourbrand.netlify.app';
    }

    /**
     * Generate and trigger download of a valid vCard 3.0 (.vcf) file.
     * Compatible with both Android and iOS native Contacts apps.
     */
    function downloadVCard(contact) {
      try {
        const cleanVal = (val) => String(val || '').replace(/[\r\n]+/g, ' ').trim();
        const fullName = cleanVal(contact.name);
        const nameParts = fullName.split(/\s+/);
        const firstName = nameParts[0] || fullName;
        const lastName = nameParts.length > 1 ? nameParts.slice(1).join(' ') : '';

        const lines = [
          'BEGIN:VCARD',
          'VERSION:3.0',
          `N:${lastName};${firstName};;;`,
          `FN:${fullName}`,
          contact.company ? `ORG:${cleanVal(contact.company)}` : '',
          contact.role ? `TITLE:${cleanVal(contact.role)}` : '',
          `TEL;TYPE=CELL,VOICE:${cleanVal(contact.phoneRaw)}`,
          contact.email ? `EMAIL;TYPE=WORK,INTERNET:${cleanVal(contact.email)}` : '',
          `URL:${cleanVal(getShareableUrl())}`,
          'END:VCARD'
        ].filter(Boolean);

        const vcfContent = lines.join('\r\n') + '\r\n';
        const blob = new Blob([vcfContent], { type: 'text/vcard;charset=utf-8' });
        const url = URL.createObjectURL(blob);

        const link = document.createElement('a');
        link.href = url;
        const safeFile = fullName.replace(/[^a-z0-9]+/gi, '_').replace(/^_|_$/g, '') || 'Contact';
        link.download = `${safeFile}.vcf`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        setTimeout(() => URL.revokeObjectURL(url), 1500);
        showToast(`Saving ${fullName}'s contact (.vcf)`);
      } catch (err) {
        showToast('Could not create contact file');
      }
    }

    /**
     * Native Web Share API with automatic clipboard fallback.
     */
    async function shareCard() {
      const shareUrl = getShareableUrl();
      const shareData = {
        title: `${CARD_CONFIG.brand.name} — Digital Visiting Card`,
        text: `Connect with ${CARD_CONFIG.brand.name} via our digital visiting card:`,
        url: shareUrl
      };

      try {
        if (navigator.share && /^https?:\/\//i.test(shareUrl)) {
          await navigator.share(shareData);
          return;
        }
      } catch (err) {
        if (err && err.name === 'AbortError') return;
      }

      const ok = copyTextToClipboard(shareUrl);
      showToast(ok ? 'Card link copied to clipboard!' : 'Open QR modal to copy link');
    }

    /* =========================================================================
       PURE JAVASCRIPT QR CODE GENERATOR (ISO/IEC 18004, Versions 1–9, ECC L)
       100% offline, zero external APIs, generates real scannable QR codes!
    ========================================================================= */
    const QRGenerator = (() => {
      // GF(256) exponent & log lookup tables (polynomial 0x11d)
      const EXP = new Uint8Array(512);
      const LOG = new Uint8Array(256);
      let x = 1;
      for (let i = 0; i < 255; i++) {
        EXP[i] = x;
        LOG[x] = i;
        x <<= 1;
        if (x & 0x100) x ^= 0x11d;
      }
      for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];

      function gfMul(a, b) {
        if (a === 0 || b === 0) return 0;
        return EXP[LOG[a] + LOG[b]];
      }

      function rsGeneratorPoly(degree) {
        let poly = [1];
        for (let i = 0; i < degree; i++) {
          const next = new Array(poly.length + 1).fill(0);
          for (let j = 0; j < poly.length; j++) {
            next[j] ^= poly[j];
            next[j + 1] ^= gfMul(poly[j], EXP[i]);
          }
          poly = next;
        }
        return poly;
      }

      function rsRemainder(data, ecCount) {
        const gen = rsGeneratorPoly(ecCount);
        const msg = new Uint8Array(data.length + ecCount);
        msg.set(data);
        for (let i = 0; i < data.length; i++) {
          const coef = msg[i];
          if (coef !== 0) {
            for (let j = 0; j < gen.length; j++) {
              msg[i + j] ^= gfMul(gen[j], coef);
            }
          }
        }
        return msg.slice(data.length);
      }

      // Version specs for ECC Level L (versions 1..9, byte mode 8-bit length)
      const SPECS = [
        null,
        { cap: 17,  dataCW: 19,  ecPerBlock: 7,  blocks: 1, align: [] },
        { cap: 32,  dataCW: 34,  ecPerBlock: 10, blocks: 1, align: [6, 18] },
        { cap: 53,  dataCW: 55,  ecPerBlock: 15, blocks: 1, align: [6, 22] },
        { cap: 78,  dataCW: 80,  ecPerBlock: 20, blocks: 1, align: [6, 26] },
        { cap: 106, dataCW: 108, ecPerBlock: 26, blocks: 1, align: [6, 30] },
        { cap: 134, dataCW: 136, ecPerBlock: 18, blocks: 2, align: [6, 34] },
        { cap: 154, dataCW: 156, ecPerBlock: 20, blocks: 2, align: [6, 22, 38] },
        { cap: 192, dataCW: 194, ecPerBlock: 24, blocks: 2, align: [6, 24, 42] },
        { cap: 230, dataCW: 232, ecPerBlock: 30, blocks: 2, align: [6, 26, 46] }
      ];

      const MASKS = [
        (r, c) => (r + c) % 2 === 0,
        (r, c) => r % 2 === 0,
        (r, c) => c % 3 === 0,
        (r, c) => (r + c) % 3 === 0,
        (r, c) => (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0,
        (r, c) => ((r * c) % 2) + ((r * c) % 3) === 0,
        (r, c) => (((r * c) % 2) + ((r * c) % 3)) % 2 === 0,
        (r, c) => (((r + c) % 2) + ((r * c) % 3)) % 2 === 0
      ];

      function utf8Bytes(str) {
        const out = [];
        for (let i = 0; i < str.length; i++) {
          let c = str.charCodeAt(i);
          if (c < 0x80) out.push(c);
          else if (c < 0x800) out.push(0xc0 | (c >> 6), 0x80 | (c & 0x3f));
          else out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 0x3f), 0x80 | (c & 0x3f));
        }
        return out;
      }

      function computeFormatBits(mask) {
        // ECC Level L = 01
        const data = (1 << 3) | mask;
        let rem = data;
        for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
        return ((data << 10) | rem) ^ 0x5412;
      }

      function computeVersionBits(version) {
        let rem = version;
        for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1f25);
        return (version << 12) | rem;
      }

      function evaluatePenalty(mat, size) {
        let score = 0;
        // Rule 1: Runs of 5+ same-colored modules in rows & cols
        for (let r = 0; r < size; r++) {
          let run = 1;
          for (let c = 1; c < size; c++) {
            if (mat[r][c] === mat[r][c - 1]) {
              run++;
              if (run === 5) score += 3;
              else if (run > 5) score += 1;
            } else run = 1;
          }
        }
        for (let c = 0; c < size; c++) {
          let run = 1;
          for (let r = 1; r < size; r++) {
            if (mat[r][c] === mat[r - 1][c]) {
              run++;
              if (run === 5) score += 3;
              else if (run > 5) score += 1;
            } else run = 1;
          }
        }
        // Rule 2: 2x2 blocks of same color
        for (let r = 0; r < size - 1; r++) {
          for (let c = 0; c < size - 1; c++) {
            const v = mat[r][c];
            if (v === mat[r][c + 1] && v === mat[r + 1][c] && v === mat[r + 1][c + 1]) {
              score += 3;
            }
          }
        }
        return score;
      }

      function generateMatrix(text) {
        let bytes = utf8Bytes(text);
        if (bytes.length > 230) bytes = bytes.slice(0, 230);

        let version = 1;
        while (version < 9 && bytes.length > SPECS[version].cap) version++;
        const spec = SPECS[version];
        const size = version * 4 + 17;

        // Build bitstream: Byte mode (0100) + 8-bit length + bytes + terminator
        const bits = [];
        const pushBits = (val, len) => {
          for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1);
        };
        pushBits(0b0100, 4);
        pushBits(bytes.length, 8);
        for (const b of bytes) pushBits(b, 8);

        const maxBits = spec.dataCW * 8;
        const termLen = Math.min(4, maxBits - bits.length);
        pushBits(0, termLen);
        while (bits.length % 8 !== 0) bits.push(0);

        const dataCW = [];
        for (let i = 0; i < bits.length; i += 8) {
          let byte = 0;
          for (let j = 0; j < 8; j++) byte = (byte << 1) | bits[i + j];
          dataCW.push(byte);
        }
        let padToggle = 0;
        while (dataCW.length < spec.dataCW) {
          dataCW.push(padToggle === 0 ? 0xec : 0x11);
          padToggle ^= 1;
        }

        // Split into blocks and compute Reed-Solomon EC codewords
        const blockLen = spec.dataCW / spec.blocks;
        const dataBlocks = [];
        const ecBlocks = [];
        for (let b = 0; b < spec.blocks; b++) {
          const slice = dataCW.slice(b * blockLen, (b + 1) * blockLen);
          dataBlocks.push(slice);
          ecBlocks.push(rsRemainder(slice, spec.ecPerBlock));
        }

        // Interleave codewords
        const finalCW = [];
        for (let i = 0; i < blockLen; i++) {
          for (let b = 0; b < spec.blocks; b++) finalCW.push(dataBlocks[b][i]);
        }
        for (let i = 0; i < spec.ecPerBlock; i++) {
          for (let b = 0; b < spec.blocks; b++) finalCW.push(ecBlocks[b][i]);
        }

        // Initialize matrix and function-module tracker
        const base = Array.from({ length: size }, () => new Uint8Array(size));
        const isFn = Array.from({ length: size }, () => new Uint8Array(size));

        const setFn = (r, c, val) => {
          if (r >= 0 && r < size && c >= 0 && c < size) {
            base[r][c] = val ? 1 : 0;
            isFn[r][c] = 1;
          }
        };

        // 1. Finder patterns + separators
        const drawFinder = (top, left) => {
          for (let r = -1; r <= 7; r++) {
            for (let c = -1; c <= 7; c++) {
              const rr = top + r, cc = left + c;
              if (rr < 0 || rr >= size || cc < 0 || cc >= size) continue;
              const inOuter = r >= 0 && r <= 6 && c >= 0 && c <= 6;
              const dark = inOuter && (
                r === 0 || r === 6 || c === 0 || c === 6 ||
                (r >= 2 && r <= 4 && c >= 2 && c <= 4)
              );
              setFn(rr, cc, dark);
            }
          }
        };
        drawFinder(0, 0);
        drawFinder(0, size - 7);
        drawFinder(size - 7, 0);

        // 2. Timing patterns
        for (let i = 8; i < size - 8; i++) {
          setFn(6, i, i % 2 === 0);
          setFn(i, 6, i % 2 === 0);
        }

        // 3. Alignment patterns
        for (const r of spec.align) {
          for (const c of spec.align) {
            if (isFn[r][c]) continue; // Skip finder overlaps
            for (let dr = -2; dr <= 2; dr++) {
              for (let dc = -2; dc <= 2; dc++) {
                const dist = Math.max(Math.abs(dr), Math.abs(dc));
                setFn(r + dr, c + dc, dist !== 1);
              }
            }
          }
        }

        // 4. Reserve format info areas & dark module
        for (let i = 0; i <= 8; i++) {
          if (i !== 6) {
            setFn(8, i, 0);
            setFn(i, 8, 0);
          }
        }
        for (let i = 0; i < 8; i++) setFn(8, size - 1 - i, 0);
        for (let i = 0; i < 7; i++) setFn(size - 1 - i, 8, 0);
        setFn(size - 8, 8, 1); // Fixed dark module

        // 5. Version info for versions >= 7
        if (version >= 7) {
          const vBits = computeVersionBits(version);
          for (let i = 0; i < 18; i++) {
            const bit = (vBits >>> i) & 1;
            const a = Math.floor(i / 3);
            const b = size - 11 + (i % 3);
            setFn(a, b, bit);
            setFn(b, a, bit);
          }
        }

        // 6. Place data bits in upward/downward zigzag
        let bitIdx = 0;
        const totalDataBits = finalCW.length * 8;
        let upward = true;
        for (let right = size - 1; right >= 1; right -= 2) {
          if (right === 6) right = 5;
          for (let step = 0; step < size; step++) {
            const r = upward ? (size - 1 - step) : step;
            for (let j = 0; j < 2; j++) {
              const c = right - j;
              if (!isFn[r][c]) {
                let dark = 0;
                if (bitIdx < totalDataBits) {
                  dark = (finalCW[bitIdx >>> 3] >>> (7 - (bitIdx & 7))) & 1;
                  bitIdx++;
                }
                base[r][c] = dark;
              }
            }
          }
          upward = !upward;
        }

        // Helper to apply mask + format info
        const buildMasked = (maskIdx) => {
          const mat = base.map((row) => new Uint8Array(row));
          const maskFn = MASKS[maskIdx];
          for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
              if (!isFn[r][c] && maskFn(r, c)) mat[r][c] ^= 1;
            }
          }
          const fBits = computeFormatBits(maskIdx);
          const getBit = (idx) => (fBits >>> idx) & 1;

          // Copy 1 around top-left finder
          const coords1 = [
            [8, 0], [8, 1], [8, 2], [8, 3], [8, 4], [8, 5], [8, 7], [8, 8],
            [7, 8], [5, 8], [4, 8], [3, 8], [2, 8], [1, 8], [0, 8]
          ];
          for (let i = 0; i < 15; i++) {
            const [r, c] = coords1[i];
            mat[r][c] = getBit(14 - i);
          }
          // Copy 2 bottom-left & top-right
          for (let i = 0; i < 7; i++) mat[size - 1 - i][8] = getBit(14 - i);
          for (let i = 0; i < 8; i++) mat[8][size - 8 + i] = getBit(7 - i);

          return mat;
        };

        // Choose optimal mask
        let bestMat = null;
        let bestScore = Infinity;
        for (let m = 0; m < 8; m++) {
          const candidate = buildMasked(m);
          const penalty = evaluatePenalty(candidate, size);
          if (penalty < bestScore) {
            bestScore = penalty;
            bestMat = candidate;
          }
        }
        return bestMat;
      }

      function renderToCanvas(canvas, text, targetPx = 216) {
        const matrix = generateMatrix(text);
        const modules = matrix.length;
        const quiet = 3;
        const totalModules = modules + quiet * 2;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const scale = Math.max(4, Math.floor((targetPx * dpr) / totalModules));
        const pxSize = totalModules * scale;

        canvas.width = pxSize;
        canvas.height = pxSize;
        canvas.style.width = `${targetPx}px`;
        canvas.style.height = `${targetPx}px`;

        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, pxSize, pxSize);

        ctx.fillStyle = '#0A0A0A';
        for (let r = 0; r < modules; r++) {
          for (let c = 0; c < modules; c++) {
            if (matrix[r][c]) {
              ctx.fillRect((c + quiet) * scale, (r + quiet) * scale, scale, scale);
            }
          }
        }
      }

      return { renderToCanvas };
    })();

                type="button"
                data-save-idx="${idx}"
                class="save-vcard-btn flex flex-col sm:flex-row items-center justify-center gap-1.5 py-2.5 px-2 rounded-xl bg-white/[0.08] hover:bg-white/[0.14] border border-white/[0.14] text-white text-xs font-semibold active:scale-95 transition-all"
              >
                ${ICONS.saveUser}
                <span>Save</span>
              </button>
            </div>
          </article>
        `;
      }).join('');

      // Attach Copy Phone Listeners
      container.querySelectorAll('.copy-phone-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const phone = btn.getAttribute('data-copy-phone');
          const ok = copyTextToClipboard(phone);
          if (ok) {
            showToast('Number copied');
            const iconEl = btn.querySelector('.copy-icon');
            const labelEl = btn.querySelector('.copy-label');
            iconEl.innerHTML = ICONS.check;
            labelEl.textContent = 'Copied';
            setTimeout(() => {
              iconEl.innerHTML = ICONS.copy;
              labelEl.textContent = 'Copy';
            }, 1600);
          } else {
            showToast('Long-press number to copy');
          }
        });
      });

      // Attach Save vCard Listeners
      container.querySelectorAll('.save-vcard-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.getAttribute('data-save-idx'));
          const contact = CARD_CONFIG.contacts[idx];
          if (contact) downloadVCard(contact);
        });
      });
    }

    function renderWhatsAppOptions() {
      const container = document.getElementById('whatsapp-container');
      container.innerHTML = CARD_CONFIG.whatsappOptions.map((item, idx) => {
        const href = item.url ? item.url : buildWhatsAppUrl(item.number, item.message);
        const delay = 290 + idx * 60;

        return `
          <a
            href="${escapeHtml(href)}"
            target="_blank"
            rel="noopener noreferrer"
            class="group relative overflow-hidden flex items-center justify-between gap-3.5 p-3.5 rounded-2xl bg-surface/85 backdrop-blur-xl border border-white/[0.08] hover:border-whatsapp/45 hover:bg-[#161D18]/90 active:scale-[0.98] transition-all duration-200 animate-fade-up"
            style="animation-delay: ${delay}ms;"
          >
            <div class="flex items-center gap-3.5 min-w-0">
              <div class="w-11 h-11 rounded-xl shrink-0 bg-whatsapp/15 border border-whatsapp/30 text-whatsapp flex items-center justify-center shadow-[0_0_20px_rgba(37,211,102,0.12)] group-hover:scale-105 transition-transform">
                <span class="scale-125">${ICONS.whatsapp}</span>
              </div>
              <div class="min-w-0">
                <p class="text-sm font-semibold text-white truncate group-hover:text-[#6EE7B7] transition-colors">
                  ${escapeHtml(item.title)}
                </p>
                <p class="text-xs text-neutral-400 truncate mt-0.5">
                  ${escapeHtml(item.subtitle)}
                </p>
              </div>
            </div>
            <div class="shrink-0 w-8 h-8 rounded-full bg-white/[0.04] group-hover:bg-whatsapp/15 flex items-center justify-center transition-colors">
              ${ICONS.arrow}
            </div>
          </a>
        `;
      }).join('');
    }

    function renderInstagramOptions() {
      const container = document.getElementById('instagram-container');
      container.innerHTML = CARD_CONFIG.instagramOptions.map((item, idx) => {
        const delay = 370 + idx * 60;

        return `
          <a
            href="${escapeHtml(item.url)}"
            target="_blank"
            rel="noopener noreferrer"
            class="group relative overflow-hidden flex items-center justify-between gap-3.5 p-3.5 rounded-2xl bg-surface/85 backdrop-blur-xl border border-white/[0.08] hover:border-pink-500/40 hover:bg-[#1B1418]/90 active:scale-[0.98] transition-all duration-200 animate-fade-up"
            style="animation-delay: ${delay}ms;"
          >
            <div class="flex items-center gap-3.5 min-w-0">
              <div class="w-11 h-11 rounded-xl shrink-0 bg-gradient-to-tr from-[#f09433] via-[#dc2743] to-[#bc1888] flex items-center justify-center shadow-[0_6px_20px_rgba(220,39,67,0.28)] group-hover:scale-105 transition-transform">
                ${ICONS.instagram}
              </div>
              <div class="min-w-0">
                <p class="text-sm font-semibold text-white truncate">
                  ${escapeHtml(item.title)}
                </p>
                <p class="text-xs text-pink-300/85 font-medium truncate mt-0.5">
                  ${escapeHtml(item.handle)}
                </p>
              </div>
            </div>
            <div class="shrink-0 w-8 h-8 rounded-full bg-white/[0.04] group-hover:bg-pink-500/15 flex items-center justify-center transition-colors">
              ${ICONS.arrow}
            </div>
          </a>
        `;
      }).join('');
    }

    function renderAdditionalDetails() {
      const container = document.getElementById('additional-container');
      const { email, emailTitle, locationTitle, addressText, mapsUrl } = CARD_CONFIG.additional;

      container.innerHTML = `
        <!-- Email Row -->
        <a
          href="mailto:${escapeHtml(email)}"
          class="group flex items-center justify-between gap-3.5 p-3.5 rounded-2xl bg-surface/85 backdrop-blur-xl border border-white/[0.08] hover:border-gold/40 active:scale-[0.98] transition-all duration-200 animate-fade-up"
          style="animation-delay: 440ms;"
        >
          <div class="flex items-center gap-3.5 min-w-0">
            <div class="w-11 h-11 rounded-xl shrink-0 bg-gold/12 border border-gold/25 text-gold-light flex items-center justify-center">
              ${ICONS.email}
            </div>
            <div class="min-w-0">
              <p class="text-sm font-semibold text-white truncate">${escapeHtml(emailTitle)}</p>
              <p class="text-xs text-neutral-400 truncate mt-0.5">${escapeHtml(email)}</p>
            </div>
          </div>
          <div class="shrink-0 w-8 h-8 rounded-full bg-white/[0.04] group-hover:bg-gold/15 flex items-center justify-center transition-colors">
            ${ICONS.arrow}
          </div>
        </a>

        <!-- Location / Google Maps Row -->
        <a
          href="${escapeHtml(mapsUrl)}"
          target="_blank"
          rel="noopener noreferrer"
          class="group flex items-center justify-between gap-3.5 p-3.5 rounded-2xl bg-surface/85 backdrop-blur-xl border border-white/[0.08] hover:border-gold/40 active:scale-[0.98] transition-all duration-200 animate-fade-up"
          style="animation-delay: 490ms;"
        >
          <div class="flex items-center gap-3.5 min-w-0">
            <div class="w-11 h-11 rounded-xl shrink-0 bg-gold/12 border border-gold/25 text-gold-light flex items-center justify-center">
              ${ICONS.mapPin}
            </div>
            <div class="min-w-0">
              <p class="text-sm font-semibold text-white truncate">${escapeHtml(locationTitle)}</p>
              <p class="text-xs text-neutral-400 truncate mt-0.5">${escapeHtml(addressText)}</p>
            </div>
          </div>
          <div class="shrink-0 w-8 h-8 rounded-full bg-white/[0.04] group-hover:bg-gold/15 flex items-center justify-center transition-colors">
            ${ICONS.arrow}
          </div>
        </a>

        <!-- Share Card Row -->
        <button
          id="inline-share-btn"
          type="button"
          class="w-full text-left group flex items-center justify-between gap-3.5 p-3.5 rounded-2xl bg-surface/85 backdrop-blur-xl border border-white/[0.08] hover:border-gold/40 active:scale-[0.98] transition-all duration-200 animate-fade-up"
          style="animation-delay: 540ms;"
        >
          <div class="flex items-center gap-3.5 min-w-0">
            <div class="w-11 h-11 rounded-xl shrink-0 bg-white/[0.07] border border-white/[0.12] text-white flex items-center justify-center">
              ${ICONS.share}
            </div>
            <div class="min-w-0">
              <p class="text-sm font-semibold text-white truncate">Share This Digital Card</p>
              <p class="text-xs text-neutral-400 truncate mt-0.5">Send link via WhatsApp, SMS or AirDrop</p>
            </div>
          </div>
          <div class="shrink-0 w-8 h-8 rounded-full bg-white/[0.04] group-hover:bg-white/10 flex items-center justify-center transition-colors">
            ${ICONS.arrow}
          </div>
        </button>
      `;

      document.getElementById('inline-share-btn').addEventListener('click', shareCard);
    }

    function renderFooter() {
      const footer = document.getElementById('card-footer');
      footer.innerHTML = `
        <p class="text-[11px] text-neutral-500 tracking-wide">
          ${escapeHtml(CARD_CONFIG.brand.footerText)}
        </p>
      `;
    }

    /* =========================================================================
       QR MODAL CONTROLLER
    ========================================================================= */
    function initQrModal() {
      const modal = document.getElementById('qr-modal');
      const modalCard = document.getElementById('qr-modal-card');
      const canvas = document.getElementById('qr-canvas');
      const urlDisplay = document.getElementById('qr-url-display');
      const openBtn = document.getElementById('dock-qr-btn');
      const closeBtn = document.getElementById('qr-close-btn');
      const copyBtn = document.getElementById('qr-copy-btn');
      const downloadBtn = document.getElementById('qr-download-btn');

      const openModal = () => {
        const url = getShareableUrl();
        urlDisplay.textContent = url;
        try {
          QRGenerator.renderToCanvas(canvas, url, 212);
        } catch (err) {
          showToast('Unable to render QR code');
        }

        modal.classList.remove('hidden');
        modal.classList.add('flex');
        requestAnimationFrame(() => {
          modal.classList.remove('opacity-0');
          modal.classList.add('opacity-100');
          modalCard.classList.remove('scale-95');
          modalCard.classList.add('scale-100');
        });
      };

      const closeModal = () => {
        modal.classList.remove('opacity-100');
        modal.classList.add('opacity-0');
        modalCard.classList.remove('scale-100');
        modalCard.classList.add('scale-95');
        setTimeout(() => {
          modal.classList.add('hidden');
          modal.classList.remove('flex');
        }, 200);
      };

      openBtn.addEventListener('click', openModal);
      closeBtn.addEventListener('click', closeModal);
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeModal();
      });

      copyBtn.addEventListener('click', () => {
        const ok = copyTextToClipboard(getShareableUrl());
        showToast(ok ? 'Link copied!' : 'Could not copy link');
      });

      downloadBtn.addEventListener('click', () => {
        try {
          const link = document.createElement('a');
          const safeBrand = CARD_CONFIG.brand.name.replace(/[^a-z0-9]+/gi, '_') || 'NFC_Card';
          link.download = `${safeBrand}_QR.png`;
          link.href = canvas.toDataURL('image/png');
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          showToast('QR Code PNG downloaded!');
        } catch (err) {
          showToast('Download failed');
        }
      });
    }

    /* =========================================================================
       INITIALIZE APP
    ========================================================================= */
    document.addEventListener('DOMContentLoaded', () => {
      renderBrandHeader();
      renderContacts();
      renderWhatsAppOptions();
      renderInstagramOptions();
      renderAdditionalDetails();
      renderFooter();
      initQrModal();

      document.getElementById('dock-share-btn').addEventListener('click', shareCard);
    });
  </script>
</body>
</html>
